name: Documentation checks
on:
  push:
  pull_request:
jobs:
  docs-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run documentation checks
        run: python -m unittest discover -s tests -v
