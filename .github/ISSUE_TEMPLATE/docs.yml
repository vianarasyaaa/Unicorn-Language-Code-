name: Perbaikan dokumentasi
description: Laporkan link, ejaan, atau navigasi yang salah
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: file
    attributes:
      label: File terkait
      placeholder: docs/30-unicorn-omega/README.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Apa yang perlu diperbaiki?
    validations:
      required: true
